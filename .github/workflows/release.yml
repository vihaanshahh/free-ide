name: Release

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to copy onto the public downloads repo. Does not retag or rebuild.
        required: true
        default: v0.1.0
        type: string

jobs:
  test:
    name: pnpm test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  release:
    name: GitHub Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm package
        env:
          SUBSPACES_VERSION: ${{ github.ref_name }}

      - name: Attach archives
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish public downloads
        run: node scripts/publish-public-release.mjs
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          SUBSPACES_TAG: ${{ github.ref_name }}

  republish:
    name: Republish public downloads
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBSPACES_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/release
          gh release download "$SUBSPACES_TAG" --pattern "subspaces-si-*.tar.gz" --dir dist/release --clobber

      - name: Publish public downloads
        run: node scripts/publish-public-release.mjs
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          SUBSPACES_TAG: ${{ inputs.tag }}
